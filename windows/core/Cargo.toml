[package]
name = "publisher-core"
version.workspace = true
edition.workspace = true
description = "Publisher backend: local API, job queue, worker and platform adapters."

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
getrandom = "0.2"
hmac = "0.12"
mime_guess = "2"
parking_lot = "0.12"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
