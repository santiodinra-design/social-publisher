[package]
name = "publisher"
version.workspace = true
edition.workspace = true
description = "Publisher for Windows"

[[bin]]
name = "Publisher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
publisher-core = { path = "../core" }
open = "5"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# Same version Tauri already builds, for Windows notifications.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry"] }
